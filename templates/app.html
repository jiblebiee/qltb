<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Quản Lý Thiết Bị — Phòng IT</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/static/images/favicon.ico?v=5">
  <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <script>
    // Chạy trước khi trang vẽ để không loé sáng một nhịp rồi mới tối đi.
    try {
      var t = localStorage.getItem('qltb-theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) { /* trình duyệt chặn lưu trữ thì cứ theo hệ thống */ }
  </script>
  <link rel="stylesheet" href="/static/css/app.css?v=5">
</head>
<body>
<div class="stage">
<div class="phone">

  <!-- Cột điều hướng bên trái, chỉ hiện trên màn hình rộng -->
  <aside class="side" id="side">
    <div class="sbrand">
      <img class="on-light" src="/static/images/logo-row.png?v=5" alt="Alta Media"
           width="857" height="200">
      <img class="on-dark"  src="/static/images/logo-row-dark.png?v=5" alt="Alta Media"
           width="857" height="200">
      <div>
        <b>Quản lý thiết bị</b>
        <em>Phòng IT</em>
      </div>
    </div>
    <nav class="snav" id="snav"></nav>
    <div class="sfoot">
      <button class="suser" onclick="openScreen('more')">
        <span class="av" id="sideAv">--</span>
        <span class="nm">
          <b id="sideName">—</b>
          <em id="sideRole">—</em>
        </span>
      </button>
      <a class="sout" href="/logout">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Đăng xuất
      </a>
    </div>
  </aside>

  <div class="col">
  <div class="appbar">
    <button class="backbtn" id="backBtn" hidden aria-label="Quay lại">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="mark" id="mark">--</div>
    <div class="who">
      <div class="t" id="barTitle">Đang tải…</div>
      <div class="s" id="barSub"></div>
    </div>
    <div class="barslot" id="barSlot"></div>
    <button class="iconbtn" id="themeBtn" aria-label="Đổi giao diện sáng / tối">
      <svg id="themeIcon" viewBox="0 0 24 24"></svg>
    </button>
    <button class="iconbtn" id="mailBtn" aria-label="Lịch sử gửi mail">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z"/><path d="M3 7l9 6 9-6"/></svg>
    </button>
  </div>

  <div class="body" id="body">
    <div class="wrapc">
    <section class="screen on" id="s-home"></section>
    <section class="screen" id="s-loans"></section>
    <section class="screen" id="s-devices"></section>
    <section class="screen" id="s-stock"></section>
    <section class="screen" id="s-more"></section>
    <section class="screen" id="s-staff"></section>
    <section class="screen" id="s-depts"></section>
    <section class="screen" id="s-maint"></section>
    <section class="screen" id="s-users"></section>
    <section class="screen" id="s-email"></section>
    </div>
  </div>

  <nav class="nav" id="nav"></nav>
  </div>

  <button class="fab" id="fab" hidden>
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    <span id="fabLabel"></span>
  </button>

  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
    <span id="toastMsg"></span>
  </div>

  <div class="scrim" id="scrim"></div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <div class="head">
      <h3 id="sheetTitle">—</h3>
      <button class="x" id="sheetClose" aria-label="Đóng">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="steps" id="sheetSteps" hidden><i></i><i></i><i></i></div>
    <div class="steplabel" id="sheetStepLabel" hidden></div>
    <div class="scroll" id="sheetBody"></div>
    <div class="foot" id="sheetFoot"></div>
  </div>

  <div class="viewer" id="viewer">
    <img id="viewerImg" alt="Ảnh sản phẩm">
    <button id="viewerClose" aria-label="Đóng ảnh">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <!-- Khung quét mã QR dán trên máy -->
  <div class="scanner" id="scanner" role="dialog" aria-modal="true" aria-labelledby="scanTitle">
    <div class="scanbox">
      <div class="scanhead">
        <b id="scanTitle">Quét mã máy</b>
        <button class="x" id="scanClose" aria-label="Đóng khung quét">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="scanview">
        <video id="scanVideo" muted playsinline></video>
        <div class="reticle"></div>
      </div>
      <div class="scanhint" id="scanHint">Đưa mã vào giữa khung</div>
    </div>
  </div>
  <canvas id="scanCanvas" hidden></canvas>
  <input type="file" id="scanPicker" accept="image/*" capture="environment" hidden>

  <input type="file" id="picker" accept="image/*" capture="environment" multiple hidden>
  <input type="file" id="xlsxPicker"
         accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
</div>
</div>

<script>
  // Máy chủ truyền sẵn phiên đăng nhập để giao diện ẩn hiện chức năng ngay
  // từ lần vẽ đầu, không phải đợi một vòng gọi API.
  window.QLTB = {
    user: {
      username: {{ username | tojson }},
      fullName: {{ full_name | tojson }},
      role: {{ role | tojson }},
      permissions: {{ permissions | tojson }}
    },
    overdueDays: {{ overdue_days }},
    lenderDepartment: {{ lender_department | tojson }}
  };
</script>
<script src="/static/js/vendor/jsqr.min.js?v=5" defer></script>
<script src="/static/js/core.js?v=5"></script>
<script src="/static/js/screens.js?v=5"></script>
<script src="/static/js/scan.js?v=5"></script>
<script src="/static/js/flows.js?v=5"></script>
<script src="/static/js/app.js?v=5"></script>
</body>
</html>
