# Cấu hình CHẠY THẬT. Không mount mã nguồn, không bật reload.
services:
  web:
    build: .
    env_file: [.env]
    ports: ["8000:8000"]
    restart: unless-stopped
    # Scheduler báo cáo và rà quá hạn chạy trong tiến trình web,
    # nên giữ đúng 1 worker để email không bị gửi trùng.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
