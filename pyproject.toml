[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Khoá `select` phải nằm trong [tool.ruff.lint], đặt ở [tool.ruff] là bị bỏ qua
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
